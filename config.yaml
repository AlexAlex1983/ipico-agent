# ── Настройки контента ───────────────────────────────────────────
# Темы для постов. Бот выбирает одну случайным образом при каждом запуске,
# либо по порядку, если cycle: true.
topics:
  - "Ожирение как фактор риска хронических неинфекционных заболеваний (сердечно-сосудистые заболевания, диабет 2 типа, некоторые виды рака)"
  - "Почему решение проблемы ожирения требует системного, а не только индивидуального подхода"
  - "Роль пищевой среды — доступность и маркетинг продуктов с высоким содержанием сахара и жира — в распространении ожирения"
  - "Детское ожирение и его долгосрочные последствия для здоровья и системы здравоохранения"
  - "Почему краткосрочные диеты неэффективны в долгосрочной перспективе — доказательный подход к управлению весом"
  - "Стигматизация людей с ожирением в системе здравоохранения и обществе, и почему это мешает лечению"
  - "Роль городской инфраструктуры и доступности физической активности в профилактике ожирения"
  - "Экономическое бремя ожирения для системы здравоохранения и общества"
  - "Значение международного сотрудничества (в т.ч. с ООН) в борьбе с ожирением"
  - "Роль ИПИКО в развитии доказательной практики профилактики и контроля веса в России"
  - "Ожирение и репродуктивное здоровье"
  - "Роль сна и стресса в развитии ожирения — то, что часто упускают из виду"
cycle: true   # true = по порядку без повторов, false = случайный выбор

# Тон и стиль, передаются модели при генерации поста.
tone: >
  Институциональный, но человечный голос независимой некоммерческой
  организации, работающей на основе доказательной медицины. Уверенный,
  основанный на фактах, взвешенный. Без излишней драматизации, без
  осуждения людей с ожирением — фокус на системных причинах и решениях,
  а не на индивидуальной "вине". Без эмодзи. Можно использовать не более
  1 релевантного хэштега, если это уместно (например, #ожирение,
  #профилактика).

max_length: 1500   # Telegram allows up to 4096 — this gives room for a complete post

# ── Безопасность ─────────────────────────────────────────────────
# Если true — бот генерирует и логирует пост, но НЕ публикует его.
dry_run: true
