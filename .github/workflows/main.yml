name: Auto-post to Telegram

on:
  schedule:
    # Moscow is UTC+3 year-round (no DST), so these times are stable.
    # 07:00 UTC = 10:00 MSK
    # 08:00 UTC = 11:00 MSK
    # 08:45 UTC = 11:45 MSK
    # 13:15 UTC = 16:15 MSK
    # 14:15 UTC = 17:15 MSK
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "45 8 * * *"
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the workflow can commit the updated topic cursor

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate.py | python post_telegram.py

      - name: Save topic cursor (so cycling doesn't repeat)
        run: |
          if [ -n "$(git status --porcelain .topic_cursor 2>/dev/null)" ]; then
            git config user.name "ipico-agent-bot"
            git config user.email "actions@github.com"
            git add .topic_cursor
            git commit -m "chore: advance topic cursor [skip ci]"
            git push
          fi
